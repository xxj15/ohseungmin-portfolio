# 예전 주소 이동: 사이트 본체는 Vercel(https://ohseungmin.vercel.app)이 main push마다 배포한다.
# GitHub Pages(https://xxj15.github.io/ohseungmin-portfolio/)에는 redirect/ 폴더만 올려,
# 예전 주소의 어떤 경로로 들어와도 같은 경로의 새 주소로 보낸다(redirect/404.html 참고).
name: Redirect old GitHub Pages URL

on:
  push:
    branches: [main]
    paths: ['redirect/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
